[package]
name = "sliver-gui"
version = "0.1.0"
edition = "2021"
description = "A graphical operator client for the Sliver C2 framework"
license = "GPL-3.0"

[[bin]]
name = "sliver-gui"
path = "src/main.rs"

[dependencies]
# ---- GUI ----
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
egui_dock = { version = "0.14", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"

# ---- gRPC / async ----
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# ---- TLS ----
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki = { package = "rustls-webpki", version = "0.102", default-features = false, features = ["std", "aws_lc_rs"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem"] }
aws-lc-rs = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http2", "tokio"] }
tower = { version = "0.5", features = ["util"] }

# ---- utility ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
dirs = "5"
flate2 = "1"
vt100 = "0.15"
portable-pty = "0.8"   # local PTY for the Sliver CLI tab
ureq = { version = "2", features = ["tls", "json", "gzip"] }
tar = "0.4"
minisign-verify = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

[build-dependencies]
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
protox = "0.7"
prost-build = "0.13"

[profile.release]
opt-level = 2
